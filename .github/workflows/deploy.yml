name: Deploy to Google Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Value Terminal e2 VM
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Run Update
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_USER || 'ronforti' }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          script: |
            echo "=== [1/5] Navigating to /opt/terminal-v8 ==="
            cd /opt/terminal-v8 || exit 1

            echo "=== [2/5] Resetting to origin/main ==="
            sudo git fetch origin main
            sudo git reset --hard origin/main
            sudo chown -R $(whoami):$(whoami) /opt/terminal-v8 2>/dev/null || true

            echo "=== [3/5] Installing Dependencies ==="
            npm install

            echo "=== [4/5] Building Production Assets ==="
            npm run build

            echo "=== [5/5] Restarting PM2 Server with Updated Env ==="
            sudo pm2 restart all --update-env 2>/dev/null || pm2 restart all --update-env 2>/dev/null || sudo pm2 restart terminal --update-env 2>/dev/null || pm2 restart terminal --update-env 2>/dev/null || true

            echo "=== Verifying Built Artifacts ==="
            ls -l dist/assets/
