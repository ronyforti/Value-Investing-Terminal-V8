name: Package Cloud Bundle

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    name: Build AI Studio Cloud Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Package
        run: node scripts/packageCloud.cjs

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-studio-cloud-bundle
          path: backups/*.zip
          if-no-files-found: error
